<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <link rel="icon" href="data:," />
  <title>Apex Foods Sanitation Demo App</title>
  <script>
    window.tailwind = window.tailwind || {};
    window.tailwind.config = { darkMode: 'class' };
  </script>
  <script id="tailwind-cdn" src="vendor/tailwind.js"></script>
  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>
  <script src="fluent_ui_shim.js"></script>
  <script src="demo_seed_data.js"></script>
  <script src="mock_dataverse_engine.js"></script>
  <style>
    html, body, #root {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      background: #F8FAFC;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var appKey = (params.get('app') || 'calendar').toLowerCase().replace(/[^a-z0-9]/g, '');
      var validApps = ['calendar', 'ganttly', 'shiftstart', 'mss', 'director', 'bolo', 'manager', 'prodsched'];
      if (validApps.indexOf(appKey) === -1) appKey = 'calendar';

      var s = document.createElement('script');
      s.src = 'bundles/' + appKey + '.js?v=2';
      s.onload = function () {
        var Comp = window.__DEMO_APP_COMPONENT__;
        var rootEl = document.getElementById('root');
        if (!Comp) {
          rootEl.innerHTML = '<div style="padding:24px;color:#C4161C;font-weight:bold;">Failed to load component for ' + appKey + '</div>';
          return;
        }
        var props = {
          dataApi: window.__APEX_DEMO_DATA_API__,
          context: window.__APEX_DEMO_CONTEXT__,
          webAPI: window.Xrm && window.Xrm.WebApi
        };
        var root = ReactDOM.createRoot(rootEl);
        root.render(React.createElement(Comp, props));
      };
      s.onerror = function (err) {
        document.getElementById('root').innerHTML = '<div style="padding:24px;color:#C4161C;font-weight:bold;">Error loading bundle: ' + appKey + '</div>';
      };
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
